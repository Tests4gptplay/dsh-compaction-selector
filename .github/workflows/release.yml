name: Publish release
on:
  push:
    branches: [main]
    paths: ['docs/releases/v*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test official host contract and production package
        run: |
          mkdir -p /tmp/compaction-release-deps
          npm install --prefix /tmp/compaction-release-deps --ignore-scripts --no-audit --no-fund @deepseek-ai/cordis@4.0.5 @deepseek-ai/dsh-compaction-basic@0.2.1-rc.3
          ln -s /tmp/compaction-release-deps/node_modules node_modules
          npm test
          npm run pack:check
          git diff --exit-code
      - name: Build exact formal release
        id: version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$VERSION" = "1.0.4"
          test -f "docs/releases/v${VERSION}.md"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          npm pack --ignore-scripts
      - name: Verify prebuilt package installs without scripts
        run: |
          mkdir -p /tmp/compaction-install-check
          cd /tmp/compaction-install-check
          npm install --offline --ignore-scripts --legacy-peer-deps --no-audit --no-fund "$GITHUB_WORKSPACE/dsh-compaction-selector-1.0.4.tgz"
          node -e 'const p=require("./node_modules/dsh-compaction-selector/package.json"); if(p.version!=="1.0.4" || !p.dsh.bundle)process.exit(1)'
      - name: Publish new tag and release without overwriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite'; exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.4 >/dev/null 2>&1; then
            echo 'Tag already exists; refusing overwrite'; exit 1
          fi
          gh release create v1.0.4 dsh-compaction-selector-1.0.4.tgz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Compaction Selector v1.0.4' --latest --notes-file docs/releases/v1.0.4.md
