name: Update published installation instructions
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/update-install-guide-release-notes.yml'
      - 'scripts/release-display-v1.0.6/NOTES.md'
permissions:
  contents: read
concurrency:
  group: dsh-compaction-selector-installation-notes-v1.0.6
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.repository == 'Tests4gptplay/dsh-compaction-selector'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only the existing release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/dsh-compaction-selector
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v1.0.6" > "$RUNNER_TEMP/release-before.json"
          jq -e '.tag_name == "v1.0.6" and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          jq -r .body "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/body-before.md"
          test "$(sha256sum "$RUNNER_TEMP/body-before.md" | cut -d' ' -f1)" = 'e7e574c7bb8ac4e5b85c030543ff3d8a8e8cf0bfbf056ef8f883712dc6274788'
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/assets-before.json"
          gh api "repos/$GH_REPO/git/ref/tags/v1.0.6" > "$RUNNER_TEMP/tag-before.json"
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag-before.json")" = '1d0f248ccb71e7e4c983534f319fdb5c6cc18837'
          gh release edit v1.0.6 --notes-file scripts/release-display-v1.0.6/NOTES.md
          gh api "repos/$GH_REPO/releases/tags/v1.0.6" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/assets-after.json"
          cmp "$RUNNER_TEMP/assets-before.json" "$RUNNER_TEMP/assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/v1.0.6" > "$RUNNER_TEMP/tag-after.json"
          cmp "$RUNNER_TEMP/tag-before.json" "$RUNNER_TEMP/tag-after.json"
          jq -r .body "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/body-after.md"
          diff -u <(sed -e '${/^$/d;}' scripts/release-display-v1.0.6/NOTES.md) <(sed -e '${/^$/d;}' "$RUNNER_TEMP/body-after.md")
