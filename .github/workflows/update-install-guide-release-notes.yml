name: Update published installation instructions
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/update-install-guide-release-notes.yml'
      - 'scripts/release-display-v1.0.7/NOTES.md'
permissions:
  contents: read
concurrency:
  group: dsh-compaction-selector-installation-notes-v1.0.7
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.repository == 'Tests4gptplay/dsh-compaction-selector'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only the existing release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/dsh-compaction-selector
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v1.0.7" > "$RUNNER_TEMP/release-before.json"
          jq -e '.tag_name == "v1.0.7" and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          jq -r .body "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/body-before.md"
          test "$(sha256sum "$RUNNER_TEMP/body-before.md" | cut -d' ' -f1)" = 'decbc3483adcf4b888ec867f93564bd541a9e653c674d74a008bfdbdf8f7162e'
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/assets-before.json"
          gh api "repos/$GH_REPO/git/ref/tags/v1.0.7" > "$RUNNER_TEMP/tag-before.json"
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag-before.json")" = '5cdcc4d68f52dc6e8b853fcd62360e5c124cfa4c'
          test "$(sha256sum scripts/release-display-v1.0.7/NOTES.md | cut -d' ' -f1)" = '55d654118d06911e932a2a499178be45f38150c8494dffa512864fcad78f7660'
          gh release edit v1.0.7 --notes-file scripts/release-display-v1.0.7/NOTES.md
          gh api "repos/$GH_REPO/releases/tags/v1.0.7" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/assets-after.json"
          cmp "$RUNNER_TEMP/assets-before.json" "$RUNNER_TEMP/assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/v1.0.7" > "$RUNNER_TEMP/tag-after.json"
          cmp "$RUNNER_TEMP/tag-before.json" "$RUNNER_TEMP/tag-after.json"
          jq -r .body "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/body-after.md"
          diff -u <(sed -e '${/^$/d;}' scripts/release-display-v1.0.7/NOTES.md) <(sed -e '${/^$/d;}' "$RUNNER_TEMP/body-after.md")
